packages:
  - packages/*

overrides:
  vite: 7.3.6
  workerd: '>=1.20260623.1'
  js-yaml@4.1.1: ^4.2.0
  '@codemirror/commands': 6.10.3
  '@codemirror/state': 6.6.0
  '@codemirror/view': 6.43.1
  '@types/node': 26.1.0
  '@lezer/markdown': 1.6.4

# Reject dependency versions published within this many minutes (24h), matching the
# CI supply-chain policy so local installs can't commit a too-fresh lockfile.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - capnweb
  - capnweb-validate
  - workerd
  - "@cloudflare/workerd-*"

allowBuilds:
  '@google/genai': true
  core-js-pure: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - '@google/genai'
  - core-js-pure
  - esbuild
  - protobufjs
  - sharp
  - workerd
