packages:
  - packages/*

allowBuilds:
  '@google/genai': true
  core-js-pure: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - capnweb
  - capnweb-validate
  - workerd
  - '@cloudflare/workerd-*'

onlyBuiltDependencies:
  - '@google/genai'
  - core-js-pure
  - esbuild
  - protobufjs
  - sharp
  - workerd

overrides:
  workerd: '>=1.20260623.1'
  js-yaml@4.1.1: ^4.2.0
  '@codemirror/commands': 6.10.3
  '@codemirror/state': 6.6.0
  '@codemirror/view': 6.43.1
  '@types/node': 26.1.0
  '@lezer/markdown': 1.6.4
